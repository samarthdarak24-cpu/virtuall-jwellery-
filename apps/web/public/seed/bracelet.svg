<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Simple Bangle -->
  <ellipse cx="250" cy="250" rx="150" ry="80" fill="none" stroke="url(#gold)" stroke-width="20" />
  <!-- Gems -->
  <circle cx="100" cy="250" r="10" fill="red" />
  <circle cx="400" cy="250" r="10" fill="red" />
  <circle cx="250" cy="330" r="10" fill="red" />
  <circle cx="250" cy="170" r="10" fill="red" />
</svg>
