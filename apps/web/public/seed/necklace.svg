<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Chain -->
  <path d="M100,50 C100,50 150,400 250,400 C350,400 400,50 400,50" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round"/>
  <!-- Pendant -->
  <circle cx="250" cy="400" r="40" fill="url(#gold)" />
  <circle cx="250" cy="400" r="15" fill="#DC143C" /> <!-- Ruby -->
</svg>
