version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: jewelfit-db
    environment:
      POSTGRES_USER: jewelfit
      POSTGRES_PASSWORD: jewelfit123
      POSTGRES_DB: jewelfit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jewelfit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: jewelfit-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioaccess
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Create MinIO bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioaccess miniosecret;
      /usr/bin/mc mb myminio/jewelfit-assets --ignore-existing;
      /usr/bin/mc anonymous set download myminio/jewelfit-assets;
      exit 0;
      "

  # Backend API
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: jewelfit-api
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jewelfit:jewelfit123@db:5432/jewelfit
      JWT_SECRET: dev-secret-change-in-production
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: jewelfit-assets
      S3_ACCESS_KEY: minioaccess
      S3_SECRET_KEY: miniosecret
      S3_REGION: us-east-1
      S3_PUBLIC_URL: http://localhost:9000/jewelfit-assets
      STRIPE_SECRET_KEY: sk_test_your_key_here
      STRIPE_WEBHOOK_SECRET: whsec_your_secret_here
      PORT: 4000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    command: sh -c "cd /app/apps/api && npx prisma migrate deploy && npx prisma generate && npm run dev"

  # Frontend Web App
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    container_name: jewelfit-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret-change-in-production
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    command: sh -c "cd /app/apps/web && npm run dev"

volumes:
  postgres_data:
  minio_data:
